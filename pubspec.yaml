# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/data/city.json
    - assets/data/country.json
    - assets/images/
    - assets/images/charge_badge.png
    - assets/images/coupon/
    - assets/images/grade/
    - assets/images/play/
    - assets/images/profile/
    - assets/images/message/
    - assets/images/post/
    - assets/images/im/
    - assets/images/task/
    - assets/anim/
    - assets/flags/

  fonts:
    - family: Black-2
      fonts:
        - asset: assets/fonts/Montserrat-Black-2.ttf
    - family: Light-6
      fonts:
        - asset: assets/fonts/Montserrat-Light-6.ttf
    - family: Medium-7
      fonts:
        - asset: assets/fonts/Montserrat-Medium-7.ttf
    - family: DIN-Condensed-Bold
      fonts:
        - asset: assets/fonts/DIN-Condensed-Bold.ttf
    - family: iconfont
      fonts:
        - asset: assets/fonts/iconfont.ttf
    - family: wy
      fonts:
        - asset: assets/fonts/wy.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.


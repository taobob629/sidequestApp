plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new Exception("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '2027'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def dartEnvironment = [
        channel : 'official'
]
if(project.hasProperty('dart-defines')) {
    dartEnvironment = dartEnvironment + project.property('dart-defines')
            .split(',')
            .collectEntries{ entry ->
                def pair = URLDecoder.decode(entry,'utf-8').split('=')
                [(pair.first()):pair.last()]
            }
}

android {
    namespace "uk.co.sidequest.wy"
    compileSdk 36

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "uk.co.sidequest.wy"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("./sign/wy.jks")
            storePassword "1234567890"
            keyAlias "wy"
            keyPassword "1234567890"
        }
        debug {
            storeFile file("./sign/wy.jks")
            storePassword "1234567890"
            keyAlias "wy"
            keyPassword "1234567890"
        }
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.release
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        debug {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all {
        variant ->
            variant.outputs.all {
                output ->
                    def outputFile = output.outputFile
                    if (outputFile.name.contains("release")) {
                        outputFileName = "SideQuest_${variant.versionName}.apk"
                    }
            }
    }

    lint {
        checkReleaseBuilds false
    }

    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }

    // 解决16 KB内存页面大小问题
    android {
        packagingOptions {
            jniLibs {
                useLegacyPackaging = true
            }
        }
    }

    // 优化构建配置
    dexOptions {
        javaMaxHeapSize "4g"
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    api 'com.tencent.mm.opensdk:wechat-sdk-android:+'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation 'com.stripe:stripe-android:20.20.0'
    implementation files('libs/alipayplusclient.aar')
    api 'com.alipay.sdk:alipaysdk-android:+@aar'

    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:32.8.1')

    // When using the BoM, you don't specify versions in Firebase library dependencies

    // Add the dependency for the Firebase SDK for Google Analytics
    implementation 'com.google.firebase:firebase-analytics'

    // TODO: Add the dependencies for any other Firebase products you want to use
    // See https://firebase.google.com/docs/android/setup#available-libraries
    // For example, add the dependencies for Firebase Authentication and Cloud Firestore
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    
    // 解决android:attr/lStar not found错误
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.facebook.soloader' && details.requested.name == 'soloader') {
            details.useVersion '0.10.4+'
        }
        // 解决android:attr/lStar not found错误
        if (details.requested.group == 'androidx.core' && details.requested.name == 'core-ktx') {
            details.useVersion '1.12.0'
        }
        if (details.requested.group == 'com.google.android.material' && details.requested.name == 'material') {
            details.useVersion '1.11.0'
        }
    }
}

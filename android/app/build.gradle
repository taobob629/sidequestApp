plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new Exception("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '2027'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def dartEnvironment = [
        channel : 'official'
]
if(project.hasProperty('dart-defines')) {
    dartEnvironment = dartEnvironment + project.property('dart-defines')
            .split(',')
            .collectEntries{ entry ->
                def pair = URLDecoder.decode(entry,'utf-8').split('=')
                [(pair.first()):pair.last()]
            }
}

android {
    namespace "uk.co.sidequest.wy"
    compileSdk 36
    ndkVersion "28.2.13676358"

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "uk.co.sidequest.wy"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("./sign/wy.jks")
            storePassword "1234567890"
            keyAlias "wy"
            keyPassword "1234567890"
        }
        debug {
            storeFile file("./sign/wy.jks")
            storePassword "1234567890"
            keyAlias "wy"
            keyPassword "1234567890"
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        debug {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all {
        variant ->
            variant.outputs.all {
                output ->
                    def outputFile = output.outputFile
                    if (outputFile.name.contains("release")) {
                        outputFileName = "SideQuest_${variant.versionName}.apk"
                    }
            }
    }

    lint {
        checkReleaseBuilds false
    }

    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }

    // Retain legacy native-library packaging; ELF page-size compatibility
    // must be provided by the libraries themselves.
    android {
        packagingOptions {
            jniLibs {
                useLegacyPackaging = true
            }
        }
    }

    // 优化构建配置
    dexOptions {
        javaMaxHeapSize "4g"
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    api 'com.tencent.mm.opensdk:wechat-sdk-android:+'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'

    // Stripe PaymentSheet uses Jetpack Compose internally. Keep every Compose
    // artifact on the same tested BOM set to avoid runtime NoSuchMethodError.
    implementation platform('androidx.compose:compose-bom:2025.09.01')
    implementation files('libs/alipayplusclient.aar')
    api 'com.alipay.sdk:alipaysdk-android:15.8.42@aar'

    // 解决android:attr/lStar not found错误
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.facebook.soloader' && details.requested.name == 'soloader') {
            details.useVersion '0.10.4+'
        }
        // 解决android:attr/lStar not found错误
        if (details.requested.group == 'androidx.core' && details.requested.name == 'core-ktx') {
            details.useVersion '1.12.0'
        }
        if (details.requested.group == 'com.google.android.material' && details.requested.name == 'material') {
            details.useVersion '1.11.0'
        }
    }
}

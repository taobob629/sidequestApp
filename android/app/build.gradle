def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new Exception("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def dartEnvironment = [
        channel : 'official'
]
if(project.hasProperty('dart-defines')) {
    dartEnvironment = dartEnvironment + project.property('dart-defines')
            .split(',')
            .collectEntries{ entry ->
                def pair = URLDecoder.decode(entry,'utf-8').split('=')
                [(pair.first()):pair.last()]
            }
}


apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdkVersion 33

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "uk.co.sidequest.wy"
        minSdkVersion 24
        targetSdkVersion 32
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            // abiFilters "arm64-v8a"
            // abiFilters "x86"
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            storeFile file("./sign/wy.jks")
            storePassword "1234567890"
            keyAlias "wy"
            keyPassword "1234567890"
        }
        debug {
            storeFile file("./sign/wy.jks")
            storePassword "1234567890"
            keyAlias "wy"
            keyPassword "1234567890"
        }
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.release
        }

        debug {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all {
        variant ->
            variant.outputs.all {
                output ->
                    def outputFile = output.outputFile
                    if (outputFile.name.contains("release")) {
                        outputFileName = "SideQuest_${variant.versionName}.apk"
                    }
            }
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    api 'com.tencent.mm.opensdk:wechat-sdk-android:+'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation 'com.stripe:stripe-android:20.6.2'
    compile (name: 'alipaysdk-15.8.06.211122170115', ext: 'aar')
    compile (name: 'pay360mobilesdk', ext: 'aar')
}
